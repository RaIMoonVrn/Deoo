<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VR Hand Control</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --accent: #6c63ff;
    --accent2: #ff6584;
    --text: #e8e8f0;
    --muted: #555570;
    --panel-bg: rgba(18,18,26,0.92);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0a0a0f; }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── camera feed ── */
  #camera-feed {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.18;
    z-index: 0;
    transform: scaleX(-1);
  }

  /* ── canvas overlay for hand drawing ── */
  #hand-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
    transform: scaleX(-1);
  }

  /* ── main layout ── */
  #app {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    padding: 12px;
    gap: 10px;
  }

  /* ── header ── */
  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: var(--panel-bg);
    border-radius: var(--radius);
    border: 1px solid rgba(108,99,255,0.2);
    backdrop-filter: blur(12px);
    flex-shrink: 0;
  }

  #header h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--accent);
  }

  #gesture-display {
    font-size: 13px;
    color: var(--muted);
    transition: color 0.2s;
  }
  #gesture-display.active {
    color: var(--accent2);
    font-weight: 600;
  }

  /* ── youtube panel ── */
  #yt-panel {
    flex: 1;
    background: var(--panel-bg);
    border-radius: var(--radius);
    border: 1px solid rgba(108,99,255,0.15);
    backdrop-filter: blur(12px);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  #yt-panel iframe {
    flex: 1;
    width: 100%;
    border: none;
    min-height: 0;
  }

  /* ── controls bar ── */
  #controls {
    display: flex;
    gap: 8px;
    padding: 8px 12px;
    background: var(--panel-bg);
    border-radius: var(--radius);
    border: 1px solid rgba(108,99,255,0.15);
    backdrop-filter: blur(12px);
    flex-shrink: 0;
    align-items: center;
    justify-content: space-between;
  }

  .ctrl-btn {
    background: rgba(108,99,255,0.12);
    border: 1px solid rgba(108,99,255,0.3);
    color: var(--text);
    border-radius: 10px;
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    touch-action: manipulation;
  }
  .ctrl-btn:active, .ctrl-btn.triggered {
    background: rgba(108,99,255,0.35);
    border-color: var(--accent);
    transform: scale(0.96);
  }

  #vol-display {
    font-size: 13px;
    color: var(--muted);
    min-width: 60px;
    text-align: center;
  }

  /* ── gesture legend ── */
  #legend {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 8px 12px;
    background: var(--panel-bg);
    border-radius: var(--radius);
    border: 1px solid rgba(255,101,132,0.1);
    backdrop-filter: blur(12px);
    flex-shrink: 0;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
  }
  .legend-icon {
    font-size: 16px;
    line-height: 1;
  }

  /* ── start overlay ── */
  #start-overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: rgba(10,10,15,0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 32px;
  }

  #start-overlay h2 {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    text-align: center;
  }
  #start-overlay p {
    font-size: 14px;
    color: var(--muted);
    text-align: center;
    line-height: 1.6;
    max-width: 300px;
  }

  #start-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 14px 36px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  #start-btn:active { opacity: 0.85; transform: scale(0.97); }

  /* ── loading indicator ── */
  #loading {
    display: none;
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    background: var(--panel-bg);
    border: 1px solid rgba(108,99,255,0.3);
    border-radius: 20px;
    padding: 8px 20px;
    font-size: 13px;
    color: var(--accent);
    backdrop-filter: blur(12px);
  }
  #loading.show { display: block; }
</style>
</head>
<body>

<video id="camera-feed" autoplay muted playsinline></video>
<canvas id="hand-canvas"></canvas>

<div id="start-overlay">
  <h2>VR Hand Control</h2>
  <p>يتحكم في يوتيوب بإيماءات يدك<br>المتصفح يحتاج إذن الكاميرا</p>
  <div style="display:flex;flex-direction:column;gap:10px;align-items:center;width:100%;max-width:280px">
    <div style="display:flex;gap:12px;font-size:13px;color:var(--muted);text-align:center">
      <div>✊<br><span style="font-size:11px">تشغيل/إيقاف</span></div>
      <div>🤙<br><span style="font-size:11px">رفع الصوت</span></div>
      <div>👇<br><span style="font-size:11px">خفض الصوت</span></div>
      <div>✌️<br><span style="font-size:11px">كتم</span></div>
    </div>
  </div>
  <button id="start-btn" onclick="startApp()">ابدأ</button>
</div>

<div id="loading">جاري تحميل MediaPipe...</div>

<div id="app">
  <div id="header">
    <h1>✋ VR Hand Control</h1>
    <span id="gesture-display">لا توجد يد</span>
  </div>

  <div id="yt-panel">
    <div id="yt-container" style="flex:1;min-height:0;"></div>
  </div>

  <div id="controls">
    <button class="ctrl-btn" id="btn-play" onclick="togglePlay()">▶ تشغيل</button>
    <span id="vol-display">🔊 100%</span>
    <button class="ctrl-btn" onclick="changeVolume(10)">+ صوت</button>
    <button class="ctrl-btn" onclick="changeVolume(-10)">- صوت</button>
    <button class="ctrl-btn" onclick="toggleMute()">🔇 كتم</button>
  </div>

  <div id="legend">
    <div class="legend-item"><span class="legend-icon">✊</span> قبضة = تشغيل/إيقاف</div>
    <div class="legend-item"><span class="legend-icon">🤙</span> إبهام لأعلى = رفع صوت</div>
    <div class="legend-item"><span class="legend-icon">👇</span> إبهام لأسفل = خفض صوت</div>
    <div class="legend-item"><span class="legend-icon">✌️</span> V = كتم</div>
  </div>
</div>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1620248257/drawing_utils.js"></script>
<!-- YouTube IFrame API -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
// ── state ──
let player = null;
let hands = null;
let camera = null;
let volume = 100;
let muted = false;
let playing = false;
let lastGesture = null;
let gestureCooldown = 0;
let appStarted = false;

const COOLDOWN_MS = 1200;

// ── YouTube setup ──
function onYouTubeIframeAPIReady() {
  player = new YT.Player('yt-container', {
    height: '100%',
    width: '100%',
    videoId: 'jNQXAC9IVRw', // default: first youtube video ever
    playerVars: {
      autoplay: 0,
      controls: 1,
      rel: 0,
      modestbranding: 1,
      playsinline: 1,
    },
    events: {
      onReady: () => {
        player.setVolume(volume);
        console.log('YT ready');
      },
      onStateChange: (e) => {
        playing = (e.data === YT.PlayerState.PLAYING);
        document.getElementById('btn-play').textContent =
          playing ? '⏸ إيقاف' : '▶ تشغيل';
      }
    }
  });
}

// ── controls ──
function togglePlay() {
  if (!player) return;
  if (playing) { player.pauseVideo(); }
  else { player.playVideo(); }
  flashBtn('btn-play');
}

function changeVolume(delta) {
  volume = Math.max(0, Math.min(100, volume + delta));
  if (player) player.setVolume(volume);
  document.getElementById('vol-display').textContent = `🔊 ${volume}%`;
}

function toggleMute() {
  if (!player) return;
  muted = !muted;
  muted ? player.mute() : player.unMute();
  document.getElementById('vol-display').textContent =
    muted ? '🔇 كتم' : `🔊 ${volume}%`;
}

function flashBtn(id) {
  const b = document.getElementById(id);
  b.classList.add('triggered');
  setTimeout(() => b.classList.remove('triggered'), 300);
}

// ── gesture recognition ──
function detectGesture(landmarks) {
  // landmarks: 21 points, each {x,y,z}
  // finger tip indices: thumb=4, index=8, middle=12, ring=16, pinky=20
  // finger pip indices: thumb=3, index=6, middle=10, ring=14, pinky=18

  const tip = (i) => landmarks[i];
  const pip = (i) => landmarks[i];

  const fingerExtended = (tipIdx, pipIdx) =>
    tip(tipIdx).y < pip(pipIdx).y; // y decreases upward in normalized coords

  const indexUp   = fingerExtended(8, 6);
  const middleUp  = fingerExtended(12, 10);
  const ringUp    = fingerExtended(16, 14);
  const pinkyUp   = fingerExtended(20, 18);

  // thumb: compare x (mirrored)
  const thumbTip = tip(4);
  const thumbBase = tip(2);
  const thumbUp = thumbTip.y < thumbBase.y - 0.08;
  const thumbDown = thumbTip.y > thumbBase.y + 0.08;

  const allFingersDown = !indexUp && !middleUp && !ringUp && !pinkyUp;
  const vSign = indexUp && middleUp && !ringUp && !pinkyUp;

  if (allFingersDown && !thumbUp && !thumbDown) return 'fist';
  if (thumbUp && allFingersDown) return 'thumb_up';
  if (thumbDown && allFingersDown) return 'thumb_down';
  if (vSign) return 'v_sign';

  return null;
}

function handleGesture(gesture) {
  const now = Date.now();
  if (now - gestureCooldown < COOLDOWN_MS) return;
  if (gesture === lastGesture) return;

  lastGesture = gesture;
  gestureCooldown = now;

  const display = document.getElementById('gesture-display');
  display.classList.add('active');
  setTimeout(() => display.classList.remove('active'), 600);

  switch (gesture) {
    case 'fist':
      display.textContent = '✊ تشغيل/إيقاف';
      togglePlay();
      break;
    case 'thumb_up':
      display.textContent = '👍 رفع الصوت';
      changeVolume(10);
      break;
    case 'thumb_down':
      display.textContent = '👎 خفض الصوت';
      changeVolume(-10);
      break;
    case 'v_sign':
      display.textContent = '✌️ كتم';
      toggleMute();
      break;
  }
}

// ── MediaPipe setup ──
async function initHandTracking(videoEl) {
  const canvas = document.getElementById('hand-canvas');
  const ctx = canvas.getContext('2d');

  hands = new Hands({
    locateFile: (file) =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`
  });

  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.6,
  });

  hands.onResults((results) => {
    // resize canvas
    canvas.width = videoEl.videoWidth || window.innerWidth;
    canvas.height = videoEl.videoHeight || window.innerHeight;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const display = document.getElementById('gesture-display');

    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
      const landmarks = results.multiHandLandmarks[0];

      // draw hand skeleton
      drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {
        color: 'rgba(108,99,255,0.6)',
        lineWidth: 2
      });
      drawLandmarks(ctx, landmarks, {
        color: 'rgba(255,101,132,0.9)',
        lineWidth: 1,
        radius: 4
      });

      const gesture = detectGesture(landmarks);
      if (gesture) {
        handleGesture(gesture);
      } else {
        if (!display.classList.contains('active')) {
          display.textContent = '👋 يد مرئية';
        }
        lastGesture = null;
      }
    } else {
      display.textContent = 'لا توجد يد';
      display.classList.remove('active');
      lastGesture = null;
    }
  });

  camera = new Camera(videoEl, {
    onFrame: async () => {
      await hands.send({ image: videoEl });
    },
    width: 640,
    height: 480,
    facingMode: 'environment' // rear camera on mobile
  });

  await camera.start();
  document.getElementById('loading').classList.remove('show');
}

// ── start app ──
async function startApp() {
  document.getElementById('start-overlay').style.display = 'none';
  document.getElementById('loading').classList.add('show');

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: 640, height: 480 },
      audio: false
    });

    const videoEl = document.getElementById('camera-feed');
    videoEl.srcObject = stream;
    await videoEl.play();

    await initHandTracking(videoEl);
    appStarted = true;

  } catch (err) {
    document.getElementById('loading').classList.remove('show');
    document.getElementById('gesture-display').textContent =
      'خطأ: ' + err.message;

    // fallback: show start overlay again with error
    const overlay = document.getElementById('start-overlay');
    overlay.querySelector('p').textContent =
      'تعذّر فتح الكاميرا: ' + err.message;
    overlay.style.display = 'flex';
    overlay.querySelector('#start-btn').textContent = 'حاول مجدداً';
  }
}
</script>
</body>
</html>
